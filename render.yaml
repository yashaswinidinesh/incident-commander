services:
  - type: web
    name: incident-commander-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: incident-commander-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: incident-commander-db
    databaseName: incident_cmd
    user: ic
    postgresMajorVersion: "16"
    plan: free
    region: oregon
    ipAllowList: []